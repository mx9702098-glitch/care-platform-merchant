<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字关爱平台 - 团队信息</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #f5f6f8; color: #1d2129; font-size: 14px; }
        
        /* ====== 顶部导航 ====== */
        .top-nav { height: 56px; background: #fff; border-bottom: 1px solid #e5e6eb; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .top-nav-left { display: flex; align-items: center; gap: 16px; }
        .top-nav-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #1d2129; }
        .top-nav-logo img { width: 28px; height: 28px; }
        .top-nav-logo svg { width: 28px; height: 28px; }
        .top-nav-collapse { cursor: pointer; font-size: 18px; color: #86909c; padding: 4px 8px; }
        .top-nav-right { display: flex; align-items: center; gap: 20px; }
        .top-nav-right .help-link { font-size: 13px; color: #4e5969; cursor: pointer; }
        .top-nav-right .help-link:hover { color: #1d2129; }
        .nav-bell { position: relative; cursor: pointer; color: #86909c; font-size: 16px; }
        .nav-bell-count { font-size: 12px; color: #86909c; }
        .nav-avatar { width: 32px; height: 32px; border-radius: 50%; background: #ff4d4f; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .nav-user-info { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .nav-user-info .team-label { color: #86909c; }
        .nav-user-info .team-name { color: #1d2129; font-weight: 600; }
        .nav-user-info .role-label { color: #86909c; font-size: 12px; }

        /* ====== 左侧菜单 ====== */
        .sidebar { width: 200px; background: #fff; border-right: 1px solid #e5e6eb; position: fixed; top: 56px; left: 0; bottom: 0; overflow-y: auto; z-index: 90; }
        .sidebar-header { padding: 20px 16px 8px; }
        .sidebar-header .greeting { font-size: 16px; font-weight: 800; color: #1d2129; margin-bottom: 8px; }
        .sidebar-avatar { width: 40px; height: 40px; border-radius: 50%; background: #f2f3f5; display: flex; align-items: center; justify-content: center; }
        .sidebar-avatar svg { width: 20px; height: 20px; color: #c9cdd4; }
        
        .menu-group { margin-bottom: 4px; }
        .menu-group-title { padding: 16px 16px 6px; font-size: 12px; color: #86909c; font-weight: 500; }
        .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; color: #4e5969; cursor: pointer; transition: all 0.15s; position: relative; }
        .menu-item:hover { background: #f7f8fa; }
        .menu-item.active { background: #f0f3ff; color: #4e6ef2; font-weight: 600; }
        .menu-item.active::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; background: #4e6ef2; border-radius: 0 2px 2px 0; }
        .menu-item svg { width: 16px; height: 16px; flex-shrink: 0; }
        .menu-item .badge { margin-left: auto; background: #ff4d4f; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600; }
        .menu-item .alert-dot { width: 6px; height: 6px; background: #ff4d4f; border-radius: 50%; margin-left: auto; }
        .menu-item .alert-text { font-size: 11px; color: #ff4d4f; margin-left: 4px; }
        .dot-badge { margin-left: auto; display: flex; align-items: center; gap: 3px; }
        .dot-r { width: 6px; height: 6px; border-radius: 50%; background: #ff4d4f; animation: blink 2s ease-in-out infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
        .dot-text { font-size: 11px; color: #ff4d4f; font-weight: 500; }
        
        .sidebar-footer { padding: 12px 16px; border-top: 1px solid #f2f3f5; font-size: 11px; color: #c9cdd4; position: absolute; bottom: 0; left: 0; right: 0; background: #fff; }

        /* ====== 主内容区 ====== */
        .main-content { margin-left: 200px; margin-top: 56px; padding: 24px; min-height: calc(100vh - 56px); }
        
        /* ====== 通知横幅（浅蓝色信息条） ====== */
        .notice-banner { position: relative; padding: 16px 40px 16px 20px; background: #E6F4FF; border: 1px solid #BAD7FF; border-radius: 8px; margin-bottom: 20px; transition: all .2s; }
        .notice-banner.hidden { display: none; }
        .nb-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .nb-icon { font-size: 16px; flex-shrink: 0; }
        .nb-title { font-size: 14px; font-weight: 700; color: #1d2129; }
        .nb-body { padding-left: 2px; }
        .nb-desc { font-size: 13px; color: #4e5969; line-height: 1.85; }
        .nb-desc strong { color: #1d2129; font-weight: 600; }
        .nb-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .nb-tag { font-size: 11px; padding: 1px 8px; border-radius: 3px; background: rgba(78,110,242,.1); color: #4e6ef2; border: 1px solid rgba(78,110,242,.2); font-weight: 500; }
        .nb-link { font-size: 12px; color: #4e6ef2; font-weight: 500; cursor: pointer; margin-top: 6px; display: inline-block; }
        .nb-link:hover { text-decoration: underline; }
        .nb-close { position: absolute; top: 14px; right: 14px; font-size: 16px; color: #8C8C8C; cursor: pointer; line-height: 1; transition: color .12s; }
        .nb-close:hover { color: #262626; }

        /* ====== 关爱主页预览弹窗 ====== */
        .preview-overlay { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .preview-overlay.hidden { display: none; }
        .preview-box { background: #fff; border-radius: 12px; width: 400px; max-height: 85vh; box-shadow: 0 12px 48px rgba(0,0,0,0.2); overflow: hidden; animation: mIn .25s ease; display: flex; flex-direction: column; }
        .preview-header { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .preview-header-title { font-size: 15px; font-weight: 600; color: #141414; }
        .preview-header-close { font-size: 18px; color: #bfbfbf; cursor: pointer; transition: color .12s; }
        .preview-header-close:hover { color: #262626; }
        .preview-body { overflow-y: auto; flex: 1; }
        .preview-phone { width: 100%; background: #f5f5f5; }
        /* 手机模拟框 */
        .phone-frame { margin: 16px auto; width: 340px; background: #fff; border-radius: 24px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #e8e8e8; }
        .phone-status-bar { height: 28px; background: #fafafa; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999; }
        .phone-content { padding: 0; }
        /* 关爱主页头部 */
        .hp-banner { width: 100%; height: 120px; background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%); position: relative; display: flex; align-items: flex-end; padding: 12px 16px; }
        .hp-banner-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.6); font-size: 12px; }
        .hp-org-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
        .hp-org-logo { width: 44px; height: 44px; border-radius: 8px; background: #f0f0f0; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #bfbfbf; margin-top: -28px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); flex-shrink: 0; }
        .hp-org-logo.has-logo { background: #ff4d4f; color: #fff; font-weight: 700; font-size: 14px; }
        .hp-org-name { font-size: 15px; font-weight: 700; color: #1a1a1a; }
        .hp-slogan { padding: 0 16px 10px; font-size: 12px; color: #666; line-height: 1.5; }
        .hp-slogan.empty { color: #ccc; font-style: italic; }
        .hp-section { padding: 10px 16px; }
        .hp-section-title { font-size: 12px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
        .hp-info-row { display: flex; align-items: flex-start; gap: 6px; padding: 4px 0; font-size: 11px; }
        .hp-info-label { color: #999; flex-shrink: 0; width: 48px; }
        .hp-info-val { color: #333; flex: 1; }
        .hp-info-val.empty { color: #ccc; font-style: italic; }
        .hp-divider { height: 6px; background: #f5f5f5; }
        .hp-tab-bar { display: flex; border-bottom: 1px solid #f0f0f0; padding: 0 16px; }
        .hp-tab { padding: 8px 0; margin-right: 20px; font-size: 12px; color: #999; position: relative; }
        .hp-tab.active { color: #ff4d4f; font-weight: 600; }
        .hp-tab.active::after { content:''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: #ff4d4f; border-radius: 1px; }
        .hp-empty-list { padding: 24px 0; text-align: center; font-size: 11px; color: #ccc; }
        .phone-bottom-bar { height: 36px; background: #fafafa; display: flex; align-items: center; justify-content: center; gap: 20px; border-top: 1px solid #f0f0f0; }
        .phone-bottom-btn { font-size: 11px; color: #ff4d4f; font-weight: 500; padding: 4px 14px; background: rgba(255,77,79,0.06); border-radius: 12px; }
        .preview-footer { padding: 12px 20px; border-top: 1px solid #f0f0f0; text-align: center; flex-shrink: 0; }
        .preview-footer-hint { font-size: 11px; color: #999; }
        .section-card { background: #fff; border: 1px solid #e5e6eb; border-radius: 8px; padding: 20px 24px; margin-bottom: 20px; position: relative; }
        .section-title { font-size: 15px; font-weight: 700; color: #1d2129; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .section-title .eye-icon { color: #c9cdd4; cursor: pointer; font-size: 16px; }
        
        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
        .field-item { padding: 12px 0; border-top: 1px solid #f2f3f5; display: flex; align-items: flex-start; gap: 0; min-height: 44px; }
        .field-grid > .field-item:nth-child(1),
        .field-grid > .field-item:nth-child(2) { border-top: none; }
        .field-item:nth-child(odd) { padding-right: 48px; }
        .field-item:nth-child(even) { padding-left: 4px; }
        .field-label { font-size: 13px; color: #8C8C8C; width: 148px; flex-shrink: 0; padding-top: 1px; line-height: 1.6; }
        .field-value { font-size: 13px; color: #262626; flex: 1; word-break: break-all; line-height: 1.6; }
        .field-value.empty { color: #BFBFBF; }
        /* 新字段高亮（珊瑚粉背景） */
        .field-item.hl { background: #FEF0ED; margin: 0 -6px; padding-left: 6px; padding-right: 48px; border-radius: 4px; }
        .field-item.hl:nth-child(even) { padding-left: 10px; padding-right: 0; }
        .field-item.hl .field-label { color: #1A1A1A; }
        /* 待完善标签 */
        .tag-pend { display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 3px; background: #FEF0ED; color: #D4604A; border: 1px solid #F3C0B3; margin-left: 6px; vertical-align: middle; flex-shrink: 0; }
        .tag-wait { display: inline-flex; align-items: center; font-size: 10px; font-weight: 500; padding: 0px 5px; border-radius: 2px; background: #FEF0ED; color: #D4604A; border: 1px solid #F3C0B3; margin-left: 5px; vertical-align: middle; flex-shrink: 0; line-height: 16px; }
        .tag-done { display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 3px; background: #F6FFED; color: #389E0D; border: 1px solid #B7EB8F; margin-left: 6px; vertical-align: middle; flex-shrink: 0; }
        /* 上传占位 */
        .upload-ph { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #BFBFBF; border: 1px dashed #BFBFBF; border-radius: 5px; padding: 4px 12px; cursor: pointer; background: #fafafa; transition: border-color .12s, color .12s; }
        .upload-ph:hover { border-color: #1677FF; color: #1677FF; }
        .upload-ph.hl-upload { border-color: #BAD7FF; color: #1677FF; background: #fff; }
        /* 填写提示 */
        .fill-hint { color: #BFBFBF; font-size: 13px; }
        .fill-link { font-size: 11px; color: #1677FF; cursor: pointer; margin-left: 4px; }
        .fill-link:hover { text-decoration: underline; }
        .hint-sub { font-size: 11px; color: #BFBFBF; margin-top: 3px; }
        /* 行内编辑输入框 */
        .inline-input { width: 100%; max-width: 320px; padding: 6px 10px; font-size: 13px; color: #262626; border: 1px solid #d9d9d9; border-radius: 4px; outline: none; transition: border-color .2s; }
        .inline-input:focus { border-color: #1677FF; box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
        .inline-input::placeholder { color: #bfbfbf; }
        .inline-input-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .inline-btn { font-size: 12px; padding: 5px 14px; border-radius: 4px; cursor: pointer; border: none; transition: all .15s; }
        .inline-btn-ok { background: #1677FF; color: #fff; }
        .inline-btn-ok:hover { background: #4096ff; }
        .inline-btn-cancel { background: #f5f5f5; color: #666; }
        .inline-btn-cancel:hover { background: #e8e8e8; }
        .char-count { font-size: 11px; color: #bfbfbf; }
        /* 上传区域 */
        .upload-area { width: 200px; height: 90px; border: 1px dashed #d9d9d9; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: border-color .2s; background: #fafafa; }
        .upload-area:hover { border-color: #1677FF; }
        .upload-area-icon { font-size: 22px; color: #bfbfbf; line-height: 1; }
        .upload-area-text { font-size: 11px; color: #999; margin-top: 4px; }
        .upload-preview-img { width: 200px; height: 90px; border-radius: 6px; object-fit: cover; border: 1px solid #e8e8e8; }
        .upload-row { display: flex; align-items: flex-start; gap: 10px; }
        .upload-actions { display: flex; gap: 6px; margin-top: 6px; }

        /* ====== 合作意向表 ====== */
        .intent-table { width: 100%; border-collapse: collapse; }
        .intent-table th { text-align: left; padding: 10px 16px; font-size: 12px; font-weight: 600; color: #86909c; background: #f7f8fa; border-bottom: 1px solid #e5e6eb; }
        .intent-table td { padding: 14px 16px; font-size: 13px; color: #4e5969; border-bottom: 1px solid #f2f3f5; }
        .intent-table tr:hover td { background: #f7f8fa; }
        .intent-type-tag { display: inline-block; background: #f0f3ff; color: #4e6ef2; font-size: 11px; padding: 2px 8px; border-radius: 3px; margin-right: 4px; font-weight: 500; }
        .intent-status { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 10px; }
        .intent-status.pending { background: #fff7e8; color: #d46b08; }
        .intent-status.contacted { background: #e8ffea; color: #00b42a; }
        .btn-mark { background: none; border: none; color: #4e6ef2; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-mark:hover { text-decoration: underline; }

        /* ====== 页面头 ====== */
        .page-header { margin-bottom: 20px; }
        .page-header .breadcrumb { font-size: 12px; color: #86909c; margin-bottom: 4px; }
        .page-header .page-title-row { display: flex; align-items: center; justify-content: space-between; }
        .page-header h2 { font-size: 18px; font-weight: 700; color: #1d2129; }


        /* ====== 团队配置表单（沿用"发起新活动"风格） ====== */
        .form-card { background: #fff; border: 1px solid #e5e6eb; border-radius: 8px; padding: 28px 32px 32px; margin-bottom: 20px; }
        .form-section-title { font-size: 16px; font-weight: 700; color: #1d2129; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #f2f3f5; }
        .form-row { display: flex; align-items: flex-start; margin-bottom: 24px; }
        .form-row:last-child { margin-bottom: 0; }
        .form-label { width: 100px; flex-shrink: 0; font-size: 14px; color: #4e5969; padding-top: 7px; text-align: right; padding-right: 16px; }
        .form-label .required { color: #ff4d4f; margin-right: 2px; }
        .form-control { flex: 1; max-width: 520px; }
        .form-input { width: 100%; padding: 7px 12px; font-size: 14px; color: #1d2129; border: 1px solid #d9d9d9; border-radius: 4px; outline: none; transition: border-color .2s; font-family: inherit; }
        .form-input:focus { border-color: #4e6ef2; box-shadow: 0 0 0 2px rgba(78,110,242,0.1); }
        .form-input::placeholder { color: #c9cdd4; }
        .form-input-count { text-align: right; font-size: 12px; color: #c9cdd4; margin-top: 4px; }
        .form-hint { font-size: 12px; color: #86909c; margin-top: 6px; line-height: 1.6; }
        .form-upload-box { width: 160px; height: 160px; border: 1px dashed #d9d9d9; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: border-color .2s; background: #fafafa; }
        .form-upload-box:hover { border-color: #4e6ef2; }
        .form-upload-icon { font-size: 28px; color: #c9cdd4; line-height: 1; }
        .form-upload-text { font-size: 12px; color: #86909c; margin-top: 6px; }
        .form-upload-preview { width: 160px; height: 160px; border-radius: 6px; object-fit: cover; border: 1px solid #e5e6eb; }
        .form-upload-preview-wrap { position: relative; width: 160px; height: 160px; border-radius: 6px; overflow: hidden; display: inline-block; }
        .form-upload-preview-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .form-upload-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; gap: 16px; opacity: 0; transition: opacity .2s; cursor: default; }
        .form-upload-preview-wrap:hover .form-upload-overlay { opacity: 1; }
        .form-upload-overlay-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 18px; transition: transform .15s; background: none; border: none; padding: 0; }
        .form-upload-overlay-btn:hover { transform: scale(1.15); }
        .form-upload-overlay-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.4); }
        .form-upload-actions { display: flex; gap: 8px; margin-top: 8px; }
        .form-upload-btn { font-size: 12px; color: #4e6ef2; cursor: pointer; background: none; border: none; padding: 0; }
        .form-upload-btn:hover { text-decoration: underline; }
        .form-upload-btn.danger { color: #ff4d4f; }
        /* 校验错误 */
        .form-error-text { font-size: 12px; color: #ff4d4f; margin-top: 4px; display: none; }
        .form-error-text.visible { display: block; }
        .form-input.has-error { border-color: #ff4d4f !important; }
        .form-input.has-error:focus { box-shadow: 0 0 0 2px rgba(255,77,79,0.1); }
        .form-upload-box.has-error { border-color: #ff4d4f !important; }
        /* 全局 toast */
        .global-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #fff; border: 1px solid #e5e6eb; border-radius: 8px; padding: 12px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 10px; z-index: 9999; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; font-size: 14px; color: #1d2129; }
        .global-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .global-toast .toast-icon { width: 20px; height: 20px; border-radius: 50%; background: #ff4d4f; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
        .form-footer { display: flex; gap: 10px; padding-top: 8px; margin-top: 8px; }
        .form-btn-primary { padding: 8px 28px; background: #4e6ef2; color: #fff; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s; font-family: inherit; }
        .form-btn-primary:hover { background: #3d5bd9; }
        .form-btn-default { padding: 8px 28px; background: #fff; color: #4e5969; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; cursor: pointer; transition: border-color .15s; font-family: inherit; }
        .form-btn-default:hover { border-color: #86909c; }
        /* 展示态 */
        .form-display-value { font-size: 14px; color: #1d2129; padding-top: 7px; line-height: 1.6; }
        .form-display-value.empty { color: #c9cdd4; }

        /* ====== 空页面占位 ====== */
        .empty-page { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; color: #c9cdd4; }
        .empty-page .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-page p { font-size: 13px; }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <div class="top-nav-left">
            <div class="top-nav-logo">
                <svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="14" fill="#ff4d4f"/><path d="M14 22c-1-1.5-6-6-6-9a4 4 0 018 0c0 3-5 7.5-6 9z" fill="#fff" stroke="#fff" stroke-width="0.5"/><circle cx="11" cy="11" r="1.5" fill="#ff4d4f"/><circle cx="17" cy="11" r="1.5" fill="#ff4d4f"/></svg>

    <script>
        // ====== 数据模型 ======
        const formData = {
            name: '数字关爱平台测试1',
            shortName: '-',
            logo: null,
            intro: '',
            orgType: '-',
            subOrgType: '-',
            rating: '无',
            foundDate: '-',
            socialOrgCert: '-',
            creditCode: '51130630MJ0A122121',
            teamAddress: '-',
            certExpiry: '-',
            bizScope: '-',
            headerImage: null,
            slogan: '',
            responsibleName: 'y****',
            responsiblePhone: '1',
            responsibleEmail: '1',
        };

        let currentPage = 'info';
        let bannerClosed = !!sessionStorage.getItem('bannerClosed');

        // 团队信息红点：首次生成主页时记录时间戳，一个月后自动隐藏
        function initRedDotTimestamp() {
            if (!localStorage.getItem('homepage_reddot_start')) {
                localStorage.setItem('homepage_reddot_start', Date.now().toString());
            }
        }
        function shouldShowRedDot() {
            const start = localStorage.getItem('homepage_reddot_start');
            if (!start) return false;
            const elapsed = Date.now() - parseInt(start);
            const oneMonth = 30 * 24 * 60 * 60 * 1000;
            return elapsed < oneMonth;
        }
        initRedDotTimestamp();

        // ====== 关爱主页字段清单（仅需完善：关爱主张、机构头图）======
        const FIELDS = {
            banner:  '机构头图',
            slogan:  '关爱主张',
        };
        const FIELD_ICONS = { banner: '', slogan: '' };
        const done = {};

        function pending() { return Object.keys(FIELDS).filter(k => !done[k]); }

        // 生成标签 HTML：已完善 / 待填写（高亮模式）/ 待完善（默认）——仅对需完善字段显示
        function tagHtml(key) {
            if (!(key in FIELDS)) return '';
            if (done[key]) return '<span class="tag-done">已完善</span>';
            return '<span class="tag-pend">待完善</span>';
        }

        function getHomepageFields() {
            const fields = [
                { key: 'banner', name: '机构头图', type: 'new' },
                { key: 'slogan', name: '关爱主张', type: 'new' },
            ];
            return fields.map(f => ({ ...f, filled: !!done[f.key] }));
        }

        function getMissingFields() {
            return getHomepageFields().filter(f => !f.filled).map(f => f.name);
        }

        // ====== 标记完善 ======
        function markDone(key) {
            done[key] = true;
            render();
            updateBanner();
            updateSidebarDot();
        }

        // ====== 关爱主张 - 编辑交互 ======
        let sloganText = '';

        function editSlogan() {
            // 已填写状态下点修改，清除done让输入框出现
            done.slogan = false;
            render();
            focusSloganInput();
        }

        function focusSloganInput() {
            setTimeout(() => {
                const input = document.getElementById('sloganInput');
                if (input) {
                    input.focus();
                    input.addEventListener('input', () => {
                        const cnt = document.getElementById('sloganCount');
                        if (cnt) cnt.textContent = input.value.length + '/30';
                    });
                }
            }, 50);
        }

        function confirmSlogan() {
            const input = document.getElementById('sloganInput');
            if (!input) return;
            const val = input.value.trim();
            if (!val) { input.focus(); input.style.borderColor = '#ff4d4f'; return; }
            sloganText = val;
            done.slogan = true;
            render();
            updateBanner();
            updateSidebarDot();
        }

        // ====== 机构头图 - 上传交互 ======
        let bannerPreviewUrl = '';

        function triggerBannerUpload() {
            // 如果还没渲染 file input（已上传状态下重新上传），动态创建
            let fileInput = document.getElementById('bannerFileInput');
            if (!fileInput) {
                fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.style.display = 'none';
                fileInput.id = 'bannerFileInput';
                fileInput.onchange = function() { handleBannerUpload(this); };
                document.body.appendChild(fileInput);
            }
            fileInput.click();
        }

        function handleBannerUpload(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            // 简单校验
            if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
            if (file.size > 5 * 1024 * 1024) { alert('图片大小不超过5MB'); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                bannerPreviewUrl = e.target.result;
                done.banner = true;
                render();
                updateBanner();
                updateSidebarDot();
            };
            reader.readAsDataURL(file);
        }

        function removeBanner() {
            bannerPreviewUrl = '';
            done.banner = false;
            render();
            updateBanner();
            updateSidebarDot();
        }

        function fillAll() {
            Object.keys(FIELDS).forEach(k => { done[k] = true; });
            render();
            updateBanner();
            updateSidebarDot();
        }

        // ====== Banner 横幅 ======
        function closeBanner() {
            bannerClosed = true;
            sessionStorage.setItem('bannerClosed', '1');
            const el = document.getElementById('noticeBanner');
            if (el) el.classList.add('hidden');
        }

        function updateBanner() {
            const p = pending();
            const banner = document.getElementById('noticeBanner');
            if (!banner) return;
            if (p.length === 0) {
                banner.classList.add('hidden');
                return;
            }
            if (bannerClosed) {
                banner.classList.add('hidden');
                return;
            }
            banner.classList.remove('hidden');
        }

        function updateSidebarDot() {
            const sbDot = document.getElementById('sbDot');
            if (!sbDot) return;
            const p = pending();
            if (p.length === 0 || !shouldShowRedDot()) {
                sbDot.style.display = 'none';
            } else {
                sbDot.style.display = 'flex';
            }
        }

        // ====== 团队配置页 - 编辑态控制 ======
        let configEditing = true; // 默认进入编辑态

        function renderTeamConfigPage() {
            const p = pending();
            const showBanner = p.length > 0 && !bannerClosed;

            if (configEditing) {
                return renderConfigEditMode(showBanner);
            } else {
                return renderConfigViewMode(showBanner);
            }
        }

        function renderConfigEditMode(showBanner) {
            return `
                <div class="page-header">
                    <div class="breadcrumb">团队管理 > 团队配置</div>
                    <div class="page-title-row">
                        <h2>团队配置</h2>
                    </div>
                </div>

                ${showBanner ? renderConfigBanner() : ''}

                <div class="form-card">
                    <div class="form-section-title">关爱主页信息</div>

                    <!-- 机构头图 -->
                    <div class="form-row">
                        <div class="form-label"><span class="required">*</span>机构头图</div>
                        <div class="form-control">
                            ${bannerPreviewUrl
                                ? `<div class="form-upload-preview-wrap">
                                    <img src="${bannerPreviewUrl}" alt="机构头图">
                                    <div class="form-upload-overlay">
                                        <button class="form-upload-overlay-btn" onclick="previewBannerImage()" title="预览">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/></svg>
                                        </button>
                                        <div class="form-upload-overlay-divider"></div>
                                        <button class="form-upload-overlay-btn" onclick="removeBanner()" title="删除">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a1 1 0 01-1 1H7a1 1 0 01-1-1V6h14zM10 11v6M14 11v6"/></svg>
                                        </button>
                                    </div>
                                   </div>`
                                : `<div class="form-upload-box" id="bannerUploadBox" onclick="triggerBannerUpload()">
                                    <span class="form-upload-icon">＋</span>
                                    <span class="form-upload-text">点击上传图片</span>
                                   </div>`
                            }
                            <input type="file" id="bannerFileInput" accept="image/png,image/jpg,image/jpeg" style="display:none" onchange="handleBannerUpload(this)">
                            <div class="form-error-text" id="bannerError">请上传机构头图</div>
                            <div class="form-hint">在关爱主页顶部展示，图片建议尺寸 750×280px，仅支持 png、jpg、jpeg 图片文件上传</div>
                        </div>
                    </div>

                    <!-- 关爱主张 -->
                    <div class="form-row">
                        <div class="form-label"><span class="required">*</span>关爱主张</div>
                        <div class="form-control">
                            <input class="form-input" id="sloganInput" type="text" maxlength="30" placeholder="请输入关爱主张，例如：专注儿童关爱，为每个孩子点亮希望" value="${sloganText}" oninput="clearSloganError()">
                            <div class="form-error-text" id="sloganError">请填写关爱主张</div>
                            <div class="form-input-count"><span id="sloganCount">${sloganText.length}/30</span></div>
                            <div class="form-hint">关爱主张是您机构的公益理念或使命宣言，将展示在关爱主页头部，帮助用户快速了解您的公益方向。</div>
                        </div>
                    </div>

                    <!-- 操作按钮 -->
                    <div class="form-row">
                        <div class="form-label"></div>
                        <div class="form-control">
                            <div class="form-footer">
                                <button class="form-btn-primary" onclick="submitConfig()">提交</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderConfigViewMode(showBanner) {
            return `
                <div class="page-header">
                    <div class="breadcrumb">团队管理 > 团队配置</div>
                    <div class="page-title-row">
                        <h2>团队配置</h2>
                    </div>
                </div>

                ${showBanner ? renderConfigBanner() : ''}

                <div class="form-card">
                    <div class="form-section-title">关爱主页信息</div>

                    <!-- 机构头图 -->
                    <div class="form-row">
                        <div class="form-label">机构头图</div>
                        <div class="form-control">
                            ${bannerPreviewUrl
                                ? `<img class="form-upload-preview" src="${bannerPreviewUrl}" alt="机构头图">`
                                : '<div class="form-display-value empty">未上传</div>'
                            }
                        </div>
                    </div>

                    <!-- 关爱主张 -->
                    <div class="form-row">
                        <div class="form-label">关爱主张</div>
                        <div class="form-control">
                            <div class="form-display-value ${sloganText ? '' : 'empty'}">${sloganText || '未填写'}</div>
                        </div>
                    </div>

                    <!-- 编辑按钮 -->
                    <div class="form-row">
                        <div class="form-label"></div>
                        <div class="form-control">
                            <div class="form-footer">
                                <button class="form-btn-primary" onclick="editConfig()">编辑</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderConfigBanner() {
            return `
                <div class="notice-banner" id="noticeBanner">
                    <div class="nb-head">
                        <div class="nb-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1677FF" stroke-width="2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 16v-4m0-4h.01"/></svg></div>
                        <div class="nb-title">完善更多信息，提升关爱主页展示效果</div>
                    </div>
                    <div class="nb-body">
                        <div class="nb-desc">
                            填写以下信息后，您的关爱主页将获得更丰富的展示效果，帮助更多用户了解您的公益成效。
                        </div>

                    </div>
                    <div class="nb-close" onclick="closeBanner()" title="关闭后下次进入仍会提示">✕</div>
                </div>
            `;
        }

        function submitConfig() {
            const input = document.getElementById('sloganInput');
            const val = input ? input.value.trim() : '';

            // 清除之前的错误状态
            clearAllErrors();

            // 校验
            let hasError = false;
            if (!bannerPreviewUrl) {
                const uploadBox = document.getElementById('bannerUploadBox');
                if (uploadBox) uploadBox.classList.add('has-error');
                const bannerErr = document.getElementById('bannerError');
                if (bannerErr) bannerErr.classList.add('visible');
                hasError = true;
            }
            if (!val) {
                if (input) input.classList.add('has-error');
                const sloganErr = document.getElementById('sloganError');
                if (sloganErr) sloganErr.classList.add('visible');
                hasError = true;
            }
            if (hasError) {
                showGlobalToast('请完成所有必填项');
                return;
            }

            sloganText = val;
            done.banner = true;
            done.slogan = true;
            configEditing = false;
            render();
            updateSidebarDot();
        }

        function clearAllErrors() {
            const uploadBox = document.getElementById('bannerUploadBox');
            if (uploadBox) uploadBox.classList.remove('has-error');
            const bannerErr = document.getElementById('bannerError');
            if (bannerErr) bannerErr.classList.remove('visible');
            const input = document.getElementById('sloganInput');
            if (input) input.classList.remove('has-error');
            const sloganErr = document.getElementById('sloganError');
            if (sloganErr) sloganErr.classList.remove('visible');
        }

        function clearSloganError() {
            const input = document.getElementById('sloganInput');
            if (input) input.classList.remove('has-error');
            const sloganErr = document.getElementById('sloganError');
            if (sloganErr) sloganErr.classList.remove('visible');
        }

        function showGlobalToast(msg) {
            let toast = document.getElementById('globalToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'globalToast';
                toast.className = 'global-toast';
                toast.innerHTML = '<span class="toast-icon">!</span><span class="toast-msg"></span>';
                document.body.appendChild(toast);
            }
            toast.querySelector('.toast-msg').textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function previewBannerImage() {
            if (!bannerPreviewUrl) return;
            window.open(bannerPreviewUrl, '_blank');
        }

        function cancelConfig() {
            // 恢复为上次保存的数据
            if (done.banner && done.slogan) {
                configEditing = false;
            }
            render();
        }

        function editConfig() {
            configEditing = true;
            render();

        }

                    input.addEventListener('input', () => {
                        const cnt = document.getElementById('sloganCount');
                        if (cnt) cnt.textContent = input.value.length + '/30';
                    });
                }
            }, 50);
        }

                'cooperation-intent': renderCooperationPage,
            };

            const titleMap = {
                'overview': '团队概览',

                'team-config': '团队配置',

                'my-activities': '发起的活动',

            if (pageMap[currentPage]) {

                main.innerHTML = renderEmptyPage(titleMap[currentPage] || '页面');

            const item = e.target.closest('.menu-item');
            if (!item) return;
            const page = item.getAttribute('data-page');
            if (!page) return;
            
            currentPage = page;
            
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            item.classList.add('active');
            
            render();
        });

            document.getElementById('previewOverlay').classList.add('hidden');

            const hasBanner = done.banner;

                </div>
